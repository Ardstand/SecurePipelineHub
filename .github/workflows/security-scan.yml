# .github/workflows/security-scan.yml
# SecurePipeline Hub — scans a target repo on every push/PR.
# Checks out the TARGET repo at the triggering commit SHA,
# runs Semgrep + Gitleaks + Trivy, passes findings through
# the processing pipeline, commits findings back, and blocks
# the PR if CRITICAL findings are detected.

name: Security Scan

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/findings/**" # never trigger on findings commits (prevents loop)
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  security-scan:
    name: Scan Commit
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout THIS repo (SecurePipeline Hub) ────────────
      - name: Checkout SecurePipeline Hub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python + dependencies ──────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: pip install -r requirements.txt python-dotenv

      # ── 3. Install scanners ───────────────────────────────────
      - name: Install Semgrep
        run: pip install semgrep --quiet

      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
          trivy --version

      # ── 4. Clone the TARGET repo ──────────────────────────────
      # TARGET_REPO_URL is set as a GitHub Actions secret so the
      # URL (including any PAT for private repos) is never exposed.
      # Format for private repo: https://<PAT>@github.com/user/repo.git
      # Format for public repo:  https://github.com/user/repo.git
      - name: Clone target repository
        run: |
          git clone "${{ secrets.TARGET_REPO_URL }}" .repo_cache --quiet
          echo "Cloned successfully"
          echo "Commits available: $(git -C .repo_cache log --oneline | wc -l)"

      # ── 5. Run pipeline on the triggering commit ──────────────
      - name: Run SecurePipeline Hub on commit
        id: pipeline
        env:
          FINDINGS_DIR: ${{ github.workspace }}/data/findings
        run: |
          python processing/commit_scanner.py \
            --sha      "${{ github.sha }}" \
            --repo-dir ".repo_cache"
        continue-on-error: true

      # ── 6. Commit findings back to this repo ──────────────────
      - name: Commit findings to SecurePipeline Hub
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/findings/

          if git diff --cached --quiet; then
            echo "No new findings — nothing to commit"
          else
            SHORT="${{ github.sha }}"
            SHORT="${SHORT:0:8}"
            git commit -m "ci: findings for ${SHORT} [ci skip]"
            git push
          fi

      # ── 7. Post PR comment ────────────────────────────────────
      - name: Post PR comment
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT="${{ github.sha }}"
          SHORT="${SHORT:0:8}"
          SUMMARY="data/findings/ci_summary_${SHORT}.json"

          if [ -f "$SUMMARY" ]; then
            python scripts/post_pr_comment.py \
              --summary "$SUMMARY" \
              --repo    "${{ github.repository }}" \
              --pr      "${{ github.event.pull_request.number }}"
          else
            echo "No summary file found — skipping comment"
          fi

      # ── 8. Block PR on CRITICAL findings ─────────────────────
      - name: Fail if CRITICAL findings detected
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo ""
          echo "=================================================="
          echo "  PR BLOCKED — CRITICAL security findings found"
          echo "  Resolve all CRITICAL findings and push again."
          echo "=================================================="
          exit 1
